[run]
# source = .
# We tell coverage to ignore all the patched / inbox / generated stuff
omit =
    scripts/phase00/INBOX/*
    scripts/phase00/inbox/*
    scripts/_*
    scripts/*.BAD.py
    scripts/*_BACKUP_*.py
    tools/fixers/*
    tools/scan/*
    tools/ops/*
    tools/_quarantine/*
    tools/_dirty/*
    self_healing_runner_v5_parallel.py

[report]
exclude_lines =
    if __name__ == "__main__":
    if TYPE_CHECKING:
