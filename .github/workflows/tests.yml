name: tests

on:
  push:
    branches: [ main, chore/**, feat/**, chore/http-stack-repair ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # if you keep tools/ under repo, install extras too
          if [ -f tools/requirements.txt ]; then pip install -r tools/requirements.txt; fi

      - name: Run pytest (fast set)
        run: |
          python -m pytest -q --disable-warnings
          echo "✅ base pytest done"

      # ✅ NEW: run your PowerShell MAGIC runner
      - name: Run MAGIC test runner
        shell: pwsh
        run: |
          .\tools\magic_test_runner.ps1 -Clean

      # ✅ NEW: upload coverage from outputs/reports/coverage.xml
      - name: Upload MAGIC coverage
        uses: actions/upload-artifact@v4
        with:
          name: magic-coverage
          path: outputs/reports/coverage.xml
          if-no-files-found: error
