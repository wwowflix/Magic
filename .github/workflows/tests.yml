name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ ci-bootstrap ]  # only to kick bootstrap runs
  workflow_dispatch: {}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # For the bootstrap branch only, allow the job to succeed even if something fails
    continue-on-error: ${{ github.ref == 'refs/heads/ci-bootstrap' || (github.event_name == 'pull_request' && github.head_ref == 'ci-bootstrap') }}

    steps:
      - uses: actions/checkout@v4

      # Short-circuit on the bootstrap branch: skip deps & tests
      - name: Bootstrap shortcut
        if: ${{ github.ref == 'refs/heads/ci-bootstrap' || (github.event_name == 'pull_request' && github.head_ref == 'ci-bootstrap') }}
        run: echo "Bootstrap branch detected — skipping deps & tests."

      - uses: actions/setup-python@v5
        if: ${{ github.ref != 'refs/heads/ci-bootstrap' && !(github.event_name == 'pull_request' && github.head_ref == 'ci-bootstrap') }}
        with:
          python-version: '3.13'

      - name: Install deps
        if: ${{ github.ref != 'refs/heads/ci-bootstrap' && !(github.event_name == 'pull_request' && github.head_ref == 'ci-bootstrap') }}
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        if: ${{ github.ref != 'refs/heads/ci-bootstrap' && !(github.event_name == 'pull_request' && github.head_ref == 'ci-bootstrap') }}
        run: python -m pytest -q --maxfail=1 --cov --cov-report=term-missing --cov-report=xml

      - name: Upload HTML coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: htmlcov
          path: htmlcov
