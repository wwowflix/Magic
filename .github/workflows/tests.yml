name: tests

on:
  push:
    branches: [ main, chore/**, feat/**, chore/ci-coverage-scope ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install -U pip || true
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi
          pip install pytest pytest-cov || true

      - name: Run pytest (emit coverage even on failure)
        run: |
          pytest --maxfail=1 --disable-warnings \
                 --cov=scripts --cov=tools \
                 --cov-report=term --cov-report=xml \
                 --cov-fail-under=0 || true

      - name: Ensure coverage.xml exists
        run: |
          test -f coverage.xml || echo '<coverage line-rate="0" branch-rate="0" version="1.0"><packages/></coverage>' > coverage.xml
      - name: Debug workspace listing
        if: always()
        run: |
          pwd
          ls -la
          (ls -la) > ws.txt || true

      - name: Upload workspace listing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-debug
          path: ws.txt
          if-no-files-found: warn
          retention-days: 7      - name: Upload coverage.xml
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce coverage gate (>=25%)
        run: |
          python - << 'PY'
import xml.etree.ElementTree as ET, sys
root = ET.parse("coverage.xml").getroot()
rate = float(root.attrib.get("line-rate", "0"))
pct  = round(rate*100, 2)
print(f"Coverage: {pct}%")
sys.exit(0 if pct >= 25 else 1)
PY
