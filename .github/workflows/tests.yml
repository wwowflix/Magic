name: tests

on:
  push:
    branches: [ main, chore/**, feat/**, chore/http-stack-repair ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run MAGIC test runner
        shell: pwsh
        run: |
          .\tools\magic_test_runner.ps1 -Clean

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: magic-coverage
          path: outputs/reports/coverage.xml
          if-no-files-found: error
