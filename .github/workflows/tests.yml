name: tests
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    env:
      # Make `import cost_manager` work (file is scripts/cost_manager.py)
      PYTHONPATH: ${{ github.workspace }};${{ github.workspace }}\scripts
      MPLBACKEND: Agg
      PIP_DISABLE_PIP_VERSION_CHECK: 1
      PIP_NO_INPUT: 1
      PIP_PREFER_BINARY: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\pip\Cache
            ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies (pwsh)
        shell: pwsh
        run: |
          python -m pip install -U pip wheel setuptools
          if (Test-Path "requirements.txt")     { python -m pip install -r requirements.txt }
          if (Test-Path "requirements-dev.txt") { python -m pip install -r requirements-dev.txt }
          python -m pip install pytest pytest-cov pandas matplotlib

      - name: Print sys.path & sanity import
        shell: pwsh
        run: |
          python - <<'PY'
          import sys, os
          print("PYTHONPATH =", os.environ.get("PYTHONPATH"))
          print("sys.path (first 15) =", sys.path[:15])
          __import__("cost_manager")
          print("import cost_manager: OK")
          PY

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q --maxfail=1 --cov --cov-report=term-missing --cov-report=xml --cov-report=html

      - name: Upload HTML coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: htmlcov
          path: htmlcov
