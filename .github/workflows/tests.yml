name: tests

on:
  push:
    branches: [ main, chore/**, feat/**, chore/http-stack-repair ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          }

      - name: Run MAGIC test runner
        shell: pwsh
        run: |
          if (Test-Path .\tools\magic_test_runner.ps1) {
            .\tools\magic_test_runner.ps1 -Clean
          } else {
            Write-Host "tools\magic_test_runner.ps1 missing – running bare pytest"
            python -m pytest -q --disable-warnings
          }

      - name: Enforce coverage ≥ 75%
        shell: pwsh
        run: |
          scripts\Blocks.py = "outputs/reports/coverage.xml"
          if (-not (Test-Path scripts\Blocks.py)) {
            Write-Host "❌ coverage.xml not found at scripts\Blocks.py"
            exit 1
          }
          [xml] = Get-Content scripts\Blocks.py
           = [math]::Round([double].coverage.'line-rate' * 100, 2)
          Write-Host "Current coverage:  %"
          if ( -lt 75) {
            Write-Host "❌ Coverage below 75%. Failing CI."
            exit 1
          } else {
            Write-Host "✅ Coverage gate passed."
          }

      - name: Run MAGIC status scan
        shell: pwsh
        run: |
          if (Test-Path .\tools\magic_status_scan.ps1) {
            .\tools\magic_status_scan.ps1
          }
          if (Test-Path .\tools\magic_quick_status.ps1) {
            .\tools\magic_quick_status.ps1
          }

      - name: Upload coverage.xml
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: outputs/reports/coverage.xml
          if-no-files-found: error
