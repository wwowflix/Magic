name: tests

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"   # nightly at 02:00 UTC
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      - "**"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    env:
      MPLBACKEND: Agg
      PIP_DISABLE_PIP_VERSION_CHECK: 1
      PIP_NO_INPUT: 1
      PIP_PREFER_BINARY: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\pip\Cache
            ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install deps (pwsh-safe)
        shell: pwsh
        run: |
          python -m pip install -U pip wheel setuptools
          if (Test-Path "requirements.txt")     { python -m pip install -r requirements.txt }
          if (Test-Path "requirements-dev.txt") { python -m pip install -r requirements-dev.txt }
          python -m pip install pytest pytest-cov pandas matplotlib

      - name: Sanity import
        shell: pwsh
        run: python -c "import sys, os; print('sys.version:', sys.version.split()[0]); print('MPLBACKEND:', os.environ.get('MPLBACKEND')); import cost_manager; print('import cost_manager: OK')"

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q --maxfail=1 --cov --cov-report=term-missing --cov-report=xml --cov-report=html

      - name: Upload HTML coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: htmlcov
          path: htmlcov



