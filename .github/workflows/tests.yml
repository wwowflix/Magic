name: tests
on:
  pull_request: { branches: [ main ] }
  push:         { branches: [ main ] }
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    env:
      MPLBACKEND: Agg
      PIP_DISABLE_PIP_VERSION_CHECK: 1
      PIP_NO_INPUT: 1
      PIP_PREFER_BINARY: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\pip\Cache
            ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install (editable) + test extras
        shell: pwsh
        run: |
          python -m pip install -U pip wheel setuptools
          python -m pip install -e ".[test]"

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q --maxfail=1 --cov --cov-report=term-missing --cov-report=xml --cov-report=html

      - name: Upload HTML coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: htmlcov
          path: htmlcov
