on:
  workflow_dispatch:
  push:
    branches: [ main, chore/precommit-rescue ]
  pull_request:
    branches: [ main ]

name: tests

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install deps
        shell: pwsh
        run: |
          python -m pip install -U pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          pip install -U pytest --cov=scripts --cov=tools --cov-report=term-missing --cov-config=.coveragerc --cov-fail-under=5 -q
      - name: Run pytest
        shell: pwsh
        run: |
          if (Get-Command pytest --cov=scripts --cov=tools --cov-report=term-missing --cov-config=.coveragerc --cov-fail-under=5 -q


