name: tests

on:
  push:
    branches: [ main, chore/**, feat/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -q

      - name: MAGIC 3-Phase Status Guard
        run: |
          echo "🔎 Running MAGIC 3-phase status guard..."
          pytest -q tests/status/test_magic_phases_status.py -x

      - name: Upload dashboard artifacts
        uses: actions/upload-artifact@v4
        with:
          name: magic-reports
          path: outputs/reports/
          if-no-files-found: warn
