name: tests

on:
  push:
    branches: [ main, chore/**, feat/**, chore/ci-coverage-scope ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        shell: pwsh
        run: |
          python -m pip install -U pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          pip install pytest pytest-cov

      - name: Run pytest (emit coverage even on failure)
        shell: pwsh
        continue-on-error: true
        run: |
          pytest --maxfail=1 --disable-warnings 
            --cov=scripts --cov=tools 
            --cov-report=term --cov-report=xml 
            --cov-fail-under=0
          if (-not (Test-Path coverage.xml)) {
            Set-Content -Encoding utf8 coverage.xml '<coverage line-rate="0" branch-rate="0" version="1.0"><packages/></coverage>'
          }

      - name: Upload coverage.xml
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

      - name: Enforce coverage gate (>=25%)
        shell: pwsh
        run: |
          [xml] = Get-Content coverage.xml -Raw
          0 = [math]::Round([double].coverage.'line-rate'*100,2)
          "Coverage: 0%"
          if (0 -lt 25) { throw "Coverage 0% < 25% gate" }
