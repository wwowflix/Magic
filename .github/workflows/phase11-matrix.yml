






  summarize:
    if: always()
    needs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: reports/
          pattern: phase11-junit-*
          merge-multiple: true

      - name: Merge JUnit (python)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Merge JUnit (python run)
        run: |
          python -m pip install --upgrade pip
          python -m pip install junitparser
          python - << 'PY'
          import sys, pathlib
          from junitparser import JUnitXml
          files = [str(p) for p in pathlib.Path("reports").rglob("*.xml")]
          if not files:
              print("No JUnit XML files found under reports/; exiting 0.")
              sys.exit(0)
          result = JUnitXml()
          for f in files:
              try:
                  result += JUnitXml.fromfile(f)
              except Exception as e:
                  print(f"Skip {f}: {e}", file=sys.stderr)
          out = pathlib.Path("reports/phase11-summary.xml")
          out.parent.mkdir(parents=True, exist_ok=True)
          result.write(str(out))
          print(f"Wrote {out} from {len(files)} file(s)")
          PY

      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: phase11-summary
          path: reports/phase11-summary.xml
          if-no-files-found: ignore
          retention-days: 7
