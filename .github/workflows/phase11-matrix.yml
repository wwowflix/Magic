name: phase11-matrix

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/phase11-matrix.yml"
      - "tests/phase11/**"
      - "scripts/phase11/**"

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install (best-effort) — don't fail the job if deps are partial
      - name: Install deps (best-effort)
        run: |
          python -m pip install --upgrade pip || true
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt || true; fi
          # tolerate pytest not present in requirements
          python -m pip install pytest || true

      - name: Run pytest (phase11 all)
        run: |
          mkdir -p reports
          # Run all tests under tests/phase11; never block artifacts
          pytest -q tests/phase11 -x --junitxml "reports/junit-all.xml" || true

      - name: Upload JUnit (all)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase11-junit-all
          path: reports/junit-all.xml
          if-no-files-found: warn
          retention-days: 7

  summarize:
    if: always()
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: reports/
          pattern: phase11-junit-*
          merge-multiple: true

      - name: Merge JUnit (python)
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Merge JUnit (python run)
        run: |
          python -m pip install --upgrade pip
          python -m pip install junitparser
          python - << 'PY'
          import sys, pathlib
          from junitparser import JUnitXml
          files = [str(p) for p in pathlib.Path("reports").rglob("*.xml")]
          if not files:
              print("No JUnit XML files found under reports/; exiting 0.")
              sys.exit(0)
          result = JUnitXml()
          for f in files:
              try:
                  result += JUnitXml.fromfile(f)
              except Exception as e:
                  print(f"Skip {f}: {e}", file=sys.stderr)
          out = pathlib.Path("reports/phase11-summary.xml")
          out.parent.mkdir(parents=True, exist_ok=True)
          result.write(str(out))
          print(f"Wrote {out} from {len(files)} file(s)")
          PY

      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: phase11-summary
          path: reports/phase11-summary.xml
          if-no-files-found: ignore
          retention-days: 7

