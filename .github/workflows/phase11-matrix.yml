name: Phase 11 Matrix Guards

on:
  push:
    branches:
      - chore/phase11-matrix-guards
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Build module matrix
        id: build
        shell: pwsh
        run: tools/ci/build_phase_matrix.ps1

  guard:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          # pip install -e .[tests]   # <- if your tests need project deps

      - name: Show module
        shell: pwsh
        run: |
          Write-Host "Job: $env:GITHUB_JOB :: module = ${{ matrix.module }}"

      - name: Prepare reports dir
  run: mkdir -p reports

          pytest -q "tests/phase11/module_${{ matrix.module }}.py" -x
  summarize:
    if: always()
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: reports/
      - name: Merge JUnit
        run: |
          pip install junitparser
          python -m junitparser merge reports/**/*.xml reports/phase11-summary.xml
      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: phase11-summary
          path: reports/phase11-summary.xml
