name: CI build + smoke
on:
  pull_request:
    branches: ["**"]

jobs:
  build-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build -t magic:ci .
      - name: Smoke test
        run: |
          mkdir -p outputs/logs
          docker run --rm magic:ci --help
          docker run --rm -v "$PWD/outputs/logs:/app/outputs/logs" magic:ci --summary /app/outputs/logs/runner_summary.tsv
          test -f outputs/logs/runner_summary.tsv
