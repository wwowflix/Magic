name: PR CI
on:
  pull_request: {}
  workflow_dispatch: {}
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt || true
          pip install mypy pytest
      - name: mypy
        run: mypy . --pretty --config-file mypy.ini
      - name: pytest
        run: pytest -q
