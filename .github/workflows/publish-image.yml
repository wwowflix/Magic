name: Publish & Smoke Docker Image
on:
  push:
    tags: ["v*"]
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.meta.outputs.VER }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}   # set to 'wwowdocker'
          password: ${{ secrets.DOCKERHUB_TOKEN }}      # Docker Hub PAT (RW)
      - name: Extract version from tag
        id: meta
        run: echo "VER=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            wwowdocker/magic:${{ steps.meta.outputs.VER }}
            wwowdocker/magic:latest

  smoke:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Pull image
        run: docker pull wwowdocker/magic:${{ needs.build-and-push.outputs.ver }}
      - name: Run container and check readiness
        run: |
          id=$(docker run -d wwowdocker/magic:${{ needs.build-and-push.outputs.ver }})
          sleep 6
          docker ps
          docker logs $id | tail -n 50
          docker logs $id | grep -q "MAGIC container ready"
          docker stop $id
