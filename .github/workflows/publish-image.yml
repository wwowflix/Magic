name: Publish Docker Image (multi-arch on tag)

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_NS: wwowdocker/magic
    steps:
      - uses: actions/checkout@v4

      - name: Read tag version
        id: meta
        run: echo "VER=${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push (amd64, arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NS }}:${{ steps.meta.outputs.VER }}
            ${{ env.IMAGE_NS }}:latest
          provenance: false

      - name: Generate SBOM
        if: always()
        run: |
          python3 -m pip install --user syft
          ~/.local/bin/syft ${{ env.IMAGE_NS }}:${{ steps.meta.outputs.VER }} -o spdx-json > sbom.json
        continue-on-error: true

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ steps.meta.outputs.VER }}
          path: sbom.json
          if-no-files-found: ignore
