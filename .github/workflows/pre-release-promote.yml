name: Pre-Release Candidate  Promote on Pass
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 1.2.0)"
        required: true
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "VER=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: '"$ImageNS"':candidate

      - name: Smoke candidate
        run: |
          cid=$(docker run -d '"$ImageNS"':candidate)
          sleep 8
          docker logs $cid | grep -q "MAGIC container ready"
          docker exec $cid python /app/scripts/phase11/self_healing_runner_v5.py --summary /tmp/runner.tsv
          docker cp $cid:/tmp/runner.tsv ./runner.tsv
          docker stop $cid

      - uses: actions/upload-artifact@v4
        with:
          name: candidate-smoke
          path: ./runner.tsv

      - name: Promote candidate  release tags
        if: success()
        run: |
          docker buildx imagetools create -t '"$ImageNS"':${{ steps.meta.outputs.VER }} '"$ImageNS"':candidate
          docker buildx imagetools create -t '"$ImageNS"':latest '"$ImageNS"':candidate
