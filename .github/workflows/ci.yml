name: MAGIC-CI

on:
  pull_request:
  push:
    branches: [ main, prod-release ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Run Ruff Lint
        run: ruff check .

      - name: Run Tests
        run: pytest -q
