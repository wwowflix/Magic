name: Smoke Phase11A

on:
  pull_request:
  push:
    branches: [ main, chore/**, feat/** ]

jobs:
  smoke-phase11A:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        shell: pwsh
        run: |
          python -m pip install -U pip
          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          }
          pip install pytest

      - name: Run Phase11A smoke test
        shell: pwsh
        run: pytest -q tests/smoke/test_phase11A_ok.py -x

      - name: Run orchestrator
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/Magic_Orchestrator_Master_v3.ps1

      - name: Guard Phase11A status
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/ci_phase11A_guard.ps1

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magic-logs
          path: outputs/logs/**
          if-no-files-found: warn
