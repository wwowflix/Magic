name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    name: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.lock.txt) { pip install -r requirements.lock.txt } else { pip install -r requirements.txt }
          if (Test-Path .\requirements-dev.txt) { pip install -r requirements-dev.txt }
      - name: Run pytest
        shell: pwsh
        run: |
          if (Test-Path .\tests) { pytest -q } else { echo "No tests dir — skipping"; exit 0 }

  mypy:
    name: mypy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.lock.txt) { pip install -r requirements.lock.txt } else { pip install -r requirements.txt }
          if (Test-Path .\requirements-dev.txt) { pip install -r requirements-dev.txt }
          pip install mypy
      - name: Run mypy (tolerant default)
        shell: pwsh
        run: |
          if (Test-Path .\mypy.ini) {
            mypy --install-types --non-interactive .
          } else {
            mypy --ignore-missing-imports --install-types --non-interactive .
          }

  lint:
    name: lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install linters
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install ruff black
      - name: Run ruff + black (check only)
        shell: pwsh
        run: |
          ruff check .
          black --check .
