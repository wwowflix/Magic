name: Smoke Phase11
on:
  pull_request:
    paths:
      - "scripts/phase11/**"
      - "tests/smoke/**"

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -U pip
      - run: pip install -r requirements.txt
      - name: Run Phase11 smokes (param)
        run: pytest -q tests/smoke/test_phase11_param_ok.py -x --junitxml=smoke-results.xml --durations=25
      - name: Upload smoke results
        uses: actions/upload-artifact@v4
        with:
          name: phase11-smoke-results
          path: |
            smoke-results.xml
            outputs/logs/master_orchestrator_summary.tsv
