name: Phase-11 Matrix (Smokes + Guards)

on:
  pull_request:
    branches: [ main, prod-release, "**" ]
    paths:
      - "scripts/**"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/smoke-phase11.yml"
  workflow_dispatch: {}

jobs:
  discover-modules:
    name: Discover Phase-11 modules
    runs-on: windows-latest
    outputs:
      modules: ${{ steps.set-matrix.outputs.modules }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: set-matrix
        name: Build matrix (A–Z, AA, AB)
        shell: pwsh
        run: |
          $root = "scripts/phase11"
          if (-not (Test-Path $root)) { throw "Missing $root" }

          $mods = Get-ChildItem -Path $root -Directory -Filter "module_*" |
                  ForEach-Object { $_.Name -replace '^module_','' } |
                  Where-Object { $_ -match '^[A-Z]{1,2}$' } |
                  Sort-Object

          if (-not $mods) { throw "No Phase-11 modules found under $root" }

          $json = @{ include = @() }
          foreach ($m in $mods) { $json.include += @{ module = $m } }
          $out = ($json | ConvertTo-Json -Compress)

          "modules=$out" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Show matrix
        shell: pwsh
        run: |
          Write-Host "Matrix = ${{ steps.set-matrix.outputs.modules }}"

  orchestrator:
    name: Orchestrator (pre-step)
    runs-on: windows-latest
    needs: discover-modules
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps (runtime only)
        shell: pwsh
        run: |
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }
          pip install pytest

      - name: Run Orchestrator
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $script = "tools/Magic_Orchestrator_Master_v3.ps1"
          if (-not (Test-Path $script)) { throw "Missing $script" }
          powershell -NoProfile -ExecutionPolicy Bypass -File $script
          if (-not (Test-Path "outputs/logs/master_orchestrator_summary.tsv")) {
            throw "Expected outputs/logs/master_orchestrator_summary.tsv"
          }

      - name: Upload orchestrator artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-logs
          path: |
            outputs/logs/master_orchestrator_summary.tsv
            outputs/logs/**/*
          if-no-files-found: warn
          retention-days: 7

  guards:
    name: Guard ${{ matrix.module }}
    runs-on: windows-latest
    needs: [discover-modules, orchestrator]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-modules.outputs.modules) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull orchestrator artifacts
        uses: actions/download-artifact@v4
        with:
          name: orchestrator-logs
          path: outputs/logs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps (runtime only)
        shell: pwsh
        run: |
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }
          pip install pytest

      - name: Run Phase-11 module guard
        shell: pwsh
        env:
          MODULE: ${{ matrix.module }}
        run: |
          $ErrorActionPreference = "Stop"
          $m = $env:MODULE
          $byName = "tools/ci_phase11_{0}_guard.ps1" -f $m
          $generic = "tools/ci_phase11_guard.ps1"

          if (Test-Path $byName) {
            Write-Host "Running per-module guard: $byName"
            powershell -NoProfile -ExecutionPolicy Bypass -File $byName
          }
          elseif (Test-Path $generic) {
            Write-Host "Running generic guard: $generic -Module $m"
            powershell -NoProfile -ExecutionPolicy Bypass -File $generic -Module $m
          }
          else {
            throw "No guard script found for module $m. Expected $byName or $generic"
          }

      - name: Upload guard artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guard-${{ matrix.module }}-artifacts
          path: |
            outputs/logs/**/*
            outputs/reports/**/*
            tests/**/smoke-results*.xml
          if-no-files-found: warn
          retention-days: 7
