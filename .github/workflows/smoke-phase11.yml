name: Phase 11 Matrix Smoke

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  discover-modules:
    runs-on: windows-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover Phase 11 modules (A–Z, AA, AB)
        id: discover
        shell: pwsh
        run: |
          $mods = Get-ChildItem scripts\phase11 -Directory -Filter "module_*" |
            ForEach-Object { ($_.Name -replace '^module_','').ToUpperInvariant() } |
            Where-Object { $_ -match '^[A-Z]{1,2}$' } |
            Sort-Object -Unique
          if (-not $mods) { throw "No phase11 modules found" }
          $obj = @{ include = @() }
          foreach ($m in $mods) { $obj.include += @{ module = $m } }
          $json = $obj | ConvertTo-Json -Depth 5
          "matrix=$json" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  orchestrate-once:
    runs-on: windows-latest
    needs: [discover-modules]
    outputs:
      summary_path: ${{ steps.path.outputs.summary_path }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Master Orchestrator
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\Magic_Orchestrator_Master_v3.ps1

      - name: Locate orchestrator summary
        id: path
        shell: pwsh
        run: |
          $p = Join-Path (Get-Location).Path 'outputs\logs\master_orchestrator_summary.tsv'
          if (-not (Test-Path $p)) {
            $glob = Join-Path (Get-Location).Path 'outputs\logs\*.tsv'
            $latest = Get-ChildItem -Path $glob -File -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if ($latest) { $p = $latest.FullName }
          }
          if (-not (Test-Path $p)) { throw "No summary TSV produced" }
          "summary_path=$p" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase11-orchestrator-summary
          path: ${{ steps.path.outputs.summary_path }}

  guard-matrix:
    runs-on: windows-latest
    needs: [discover-modules, orchestrate-once]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-modules.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download summary artifact
        uses: actions/download-artifact@v4
        with:
          name: phase11-orchestrator-summary
          path: outputs/logs

      - name: Guard Module
        shell: pwsh
        run: |
          $summary = Get-ChildItem outputs\logs\* -Filter *.tsv |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $summary) { throw "Missing orchestrator summary TSV" }
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File tools\ci_phase11_guard.ps1 `
            -Module "${{ matrix.module }}" `
            -SummaryPath $summary.FullName -Verbose
