name: Phase11 Smokes + Guards (Matrix)

on:
  pull_request:
    paths:
      - "scripts/phase11/**"
      - "tests/smoke/**"
      - "tools/**"
      - ".github/workflows/smoke-phase11.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  orchestrator:
    name: Orchestrator (pre-step)
    runs-on: windows-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (minimal)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: Run Phase-11 Orchestrator
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\Magic_Orchestrator_Master_v3.ps1
          if (!(Test-Path "outputs\logs\master_orchestrator_summary.tsv")) {
            Write-Error "master_orchestrator_summary.tsv not found."
            exit 2
          }

      - name: Upload Orchestrator Summary
        uses: actions/upload-artifact@v4
        with:
          name: master_orchestrator_summary
          path: outputs/logs/master_orchestrator_summary.tsv
          if-no-files-found: error

      - name: Discover Phase-11 Modules → matrix JSON
        id: discover
        shell: pwsh
        run: |
          $mods = Get-ChildItem -Path scripts\phase11 -Directory -Filter 'module_*' -EA SilentlyContinue |
            ForEach-Object { ($_.Name -replace '^module_','').ToUpperInvariant() } |
            Where-Object { $_ -match '^[A-Z]{1,2}$' } |
            Sort-Object -Unique
          if (-not $mods) { throw "No phase11 modules found" }
          $obj  = @{ include = @() }
          foreach ($m in $mods) { $obj.include += @{ module = $m } }
          $json = $obj | ConvertTo-Json -Depth 5 -Compress
          "matrix=$json" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Modules: $($mods -join ', ')"
          Write-Host "Matrix: $json"

  guards:
    name: Guard – ${{ matrix.module }}
    needs: [orchestrator]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.orchestrator.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bring Orchestrator Summary
        uses: actions/download-artifact@v4
        with:
          name: master_orchestrator_summary
          path: outputs/logs

      - name: Show summary head
        shell: pwsh
        run: |
          Get-Content -Path "outputs\logs\master_orchestrator_summary.tsv" -TotalCount 15

      - name: Run Guard for module ${{ matrix.module }}
        shell: pwsh
        run: |
          $m = "${{ matrix.module }}"
          # Primary flat guard path (as per your repo)
          $script = "tools\ci_phase11${m}_guard.ps1"
          if (!(Test-Path $script)) {
            # Optional alternates if you change layout later:
            $alt = "tools\ci_phase11\$m\ci_phase11${m}_guard.ps1"
            if     (Test-Path $alt)   { $script = $alt }
            else { Write-Error "Guard script not found for module $m"; exit 3 }
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File $script

      - name: Upload guard logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guard-logs-${{ matrix.module }}
          path: |
            outputs/logs/**
            tests/smoke/**/smoke-results*.xml
          if-no-files-found: ignore
