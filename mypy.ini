[mypy]
python_version = 3.13
pretty = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unreachable = True
no_implicit_optional = True
exclude = (?x)^(backups|outputs|scripts|venv|clean_env|\.git|\.mypy_cache|\.ruff_cache)(/|\\)|_BACKUP_

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True
[mypy-dotenv]
ignore_missing_imports = True
[mypy-notion_client]
ignore_missing_imports = True
[mypy-watchdog.*]
ignore_missing_imports = True
[mypy-self_healing_runner_v4_7]
ignore_missing_imports = True
