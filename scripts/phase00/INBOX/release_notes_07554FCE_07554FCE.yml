name: release-notes
on:
  push:
    paths:
      - 'outputs/reports/week_status_report_*.tsv'
      - 'tools/make_release_notes.ps1'
    tags:
      - 'v*'
  workflow_dispatch: {}
jobs:
  build-notes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate notes
        run: powershell -ExecutionPolicy Bypass -File tools/make_release_notes.ps1
      - name: Upload notes artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: docs/releases/RELEASE_NOTES_v1.0-stable.md
