repos:
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        exclude: ^(backups|quarantine|outputs|docs|\.github)/|^scripts/otData\.py$|^scripts/__init___.*\.py$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.6
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^(backups|quarantine|outputs|docs|\.github)/|^scripts/otData\.py$|^scripts/__init___.*\.py$
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        args:
          - --ignore-missing-imports
          - --install-types
          - --non-interactive
          - "--exclude"
          - "^(backups|quarantine|outputs|docs|\.github)/|^scripts/otData\.py$|^scripts/__init___.*\.py$"
