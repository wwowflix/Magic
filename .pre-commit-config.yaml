repos:
  # Core pre-commit hooks (you can adjust/expand later)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ['--maxkb=1024']

  # Your local hook to block runtime artifacts
  - repo: local
    hooks:
      - id: block-runtime-reports
        name: Block runtime report artifacts from commits
        entry: powershell -NoProfile -ExecutionPolicy Bypass -File tools/hooks/block_runtime_reports.ps1
        language: system
        pass_filenames: false
