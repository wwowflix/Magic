repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: fonttools-shadow-guard
        name: fonttools shadowing guard
        entry: python tools/inject_fonttools_shim.py
        language: system
        pass_filenames: false
