exclude: |
  ^backups/|
  ^outputs/|
  ^outputs_logs?/|
  ^\.venv/|^venv/|
  ^dist/|^build/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        files: ^(tools/|src/|MAGIC/)
        exclude: ^(scripts/|backups/|quarantine/|outputs/|wheels/|venv/|\.venv/|clean_env/|flow_export/|magic_file_tracker_export\.csv)
      - id: trailing-whitespace
        files: ^(tools/|src/|MAGIC/)
        exclude: ^(scripts/|backups/|quarantine/|outputs/|wheels/|venv/|\.venv/|clean_env/|flow_export/|magic_file_tracker_export\.csv)
      - id: check-yaml
        files: ^(tools/|src/|MAGIC/)
        exclude: ^(scripts/|backups/|quarantine/|outputs/|wheels/|venv/|\.venv/|clean_env/|flow_export/|magic_file_tracker_export\.csv)
      - id: mixed-line-ending
        args: [--fix=lf]
        files: ^(tools/|src/|MAGIC/)
        exclude: ^(scripts/|backups/|quarantine/|outputs/|wheels/|venv/|\.venv/|clean_env/|flow_export/|magic_file_tracker_export\.csv)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.12
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(tools/|src/|MAGIC/)
        exclude: ^(scripts/|backups/|quarantine/|outputs/|wheels/|venv/|\.venv/|clean_env/|flow_export/|magic_file_tracker_export\.csv)

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.17.1
    hooks:
      - id: mypy
        files: ^(tools/|src/|MAGIC/|self_healing_runner.*\.py$)
        exclude: ^(scripts/|backups/|quarantine/|outputs/|wheels/|venv/|\.venv/|clean_env/|flow_export/|magic_file_tracker_export\.csv)
        additional_dependencies:
          - types-requests
          - types-PyYAML