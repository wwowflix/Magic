repos:
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        language_version: python3
        exclude: |
          (?x)
          ^scripts/.*_2\.py$
          | ^scripts/.*_3\.py$
          | ^scripts/core\.py$
          | ^scripts/constants_2\.py$
          | ^scripts/deduplicate_records_2\.py$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy