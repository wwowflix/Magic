default_language_version:
  python: python3

repos:
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        # Only run on our real code paths
        files: ^(agents|scripts/phase\\d+/module_[A-Z]|tools)/.*\\.py$
        exclude: ^(backups|outputs|logs)(/|\\)

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        args: ["--config-file", "mypy.ini"]
        files: ^(agents|scripts/phase\\d+/module_[A-Z]|tools)/.*\\.py$
        exclude: ^(backups|outputs|logs)(/|\\)
