exclude: '^(?:clean_env|venv|\.venv|.*site-packages)(?:/|\\)'
repos:
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        files: '\.py$'
        exclude: '^(scripts/|quarantine/|backups/|outputs/|venv/|\.hooks/)'
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.17.1
    hooks:
      - id: mypy
        additional_dependencies: [types-requests, types-urllib3]
        exclude: '^(scripts/|quarantine/|backups/|outputs/|venv/)'
  - repo: local
    hooks:
      - id: forbid-bom
        name: Forbid UTF-8 BOM in Python files
        entry: python .hooks/forbid_bom.py
        language: system
        files: '\.py$'
        exclude: '^(scripts/|quarantine/|backups/|outputs/|venv/|\.hooks/)'