repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: local
    hooks:
      - id: block-ignored-secrets-and-artifacts
        name: Block .env / .coverage / .artifacts/*
        entry: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/hooks/block_ignored_paths.ps1
        language: system
        pass_filenames: true
        stages: [pre-commit]