repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: ^configs/broken/|^scripts/phase00/INBOX/

  - repo: local
    hooks:
      - id: phase11a-guard
        name: Phase11A Orchestrator Guard
        entry: powershell -NoProfile -ExecutionPolicy Bypass -File tools/ci_phase11A_guard.ps1
        language: system
        pass_filenames: false
        stages: [pre-commit]
