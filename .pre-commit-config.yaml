repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: fonttools-shadow-guard
        name: fonttools shadowing guard
        entry: python tools/inject_fonttools_shim.py
        language: system
        pass_filenames: false

repos:
  - repo: local
    hooks:
      - id: runner-sanity-guard
        name: runner-sanity-guard
        language: system
        entry: pwsh ./.hooks/runner_sanity_guard.ps1
        files: ^(tools/|scripts/).+\.py$
