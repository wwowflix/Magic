repos:
  - repo: local
    hooks:
      - id: forbid-binaries
        name: Forbid committing large/binary artifacts (Windows)
        entry: powershell
        args:
          - -NoProfile
          - -ExecutionPolicy
          - Bypass
          - -File
          - .\tools\hooks\forbid_binaries.ps1
        language: system
        pass_filenames: falserepos:
- repo: https://github.com/Yelp/detect-secrets
  rev: v1.5.0
  hooks:
    - id: detect-secrets
      args: ["--baseline", ".secrets.baseline"]
