# .pre-commit-config.yaml
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
        # don't rewrite generated reports or CI artifacts
        exclude: ^reports/|^reports/ci/|^reports/phase11_.*\.xml$|^outputs/
      - id: trailing-whitespace
        exclude: ^reports/|^outputs/
      - id: mixed-line-ending
        # keep LF for code, but leave PS scripts alone (CRLF via .gitattributes)
        args: [--fix=lf]
        exclude: ^reports/|^outputs/|\.ps1$|\.psm1$
